<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparte tus fotos · Kristal & Arturo</title>
<meta name="theme-color" content="#5E6F2D">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--olive:#6b7340;--olive-d:#4f5730;--gold:#c2a15a;--gold-d:#a8863c;--cream:#f4ecd8;--paper:#fbf5e6;--ink:#4a4f33;--ok:#5E6F2D;--err:#b03a2e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);background:var(--cream);min-height:100svh;
 padding:env(safe-area-inset-top) 18px calc(30px + env(safe-area-inset-bottom));
 background-image:radial-gradient(circle at 0 0,rgba(150,105,45,.14),transparent 30%),radial-gradient(circle at 100% 100%,rgba(150,105,45,.16),transparent 32%)}
.wrap{max-width:520px;margin:0 auto;text-align:center;padding-top:34px}
.eyebrow{font-size:13px;letter-spacing:.38em;text-indent:.38em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(46px,13vw,64px);color:var(--olive);line-height:1.15;margin:8px 0 10px}
h1 em{display:block;color:var(--gold-d);font-style:normal}
.lead{font-size:21px;font-style:italic;line-height:1.45;margin-bottom:22px}
.card{background:var(--paper);border:1px solid rgba(194,161,90,.55);border-radius:14px;padding:22px 18px;box-shadow:0 10px 26px rgba(80,75,40,.12);text-align:left}
label.t{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d);font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(194,161,90,.55);background:#fffaf0;color:var(--ink);font:500 19px 'Cormorant Garamond',serif;margin-bottom:16px}
.btn{display:block;width:100%;padding:16px;border-radius:999px;border:0;background:var(--olive);color:#fff;font:700 16px 'Cormorant Garamond',serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-align:center}
.btn:active{background:var(--olive-d)}
.btn[disabled]{opacity:.5}
.btn.gold{background:linear-gradient(135deg,#d6b86d,#b8943f);margin-top:12px}
#lista{margin-top:16px;display:grid;gap:10px}
.f{background:#fffaf0;border:1px solid rgba(194,161,90,.4);border-radius:10px;padding:10px 12px}
.f .n{display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:600}
.f .n span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:#e9dfc2;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--olive);transition:width .2s}
.f.ok .bar i{background:var(--ok)} .f.err .bar i{background:var(--err)}
.f small{display:block;font-size:14px;margin-top:4px;color:#7a7a5a}
.f.err small{color:var(--err)}
#resumen{margin-top:14px;font-size:19px;text-align:center;font-style:italic}
.nota{margin-top:18px;font-size:16px;opacity:.85}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Kristal & Arturo</div>
  <h1>Comparte <em>tus recuerdos</em></h1>
  <p class="lead">Sube las fotos y videos que tomaste en nuestra boda. ¡Queremos verlos todos!</p>

  <div class="card">
    <label class="t" for="quien">Tu nombre (opcional)</label>
    <input id="quien" type="text" placeholder="Ej. Familia Zepeda" maxlength="40" autocomplete="off">

    <input id="picker" type="file" accept="image/*,video/*" multiple class="hide">
    <button class="btn" id="elegir" type="button">Elegir fotos y videos</button>

    <div id="lista"></div>
    <div id="resumen"></div>
    <button class="btn gold hide" id="mas" type="button">Subir más</button>
  </div>

  <p class="nota">Mantén esta pantalla abierta hasta que termine la subida. Los videos pueden tardar un poco. 💚</p>
</div>

<script>
/* ===== PEGA AQUÍ LA URL DE TU APLICACIÓN WEB (termina en /exec) ===== */
const SCRIPT_URL = 'PEGA_AQUI_LA_URL_DE_APPS_SCRIPT';
const MAX_BYTES = 3 * 1024 * 1024 * 1024;
const REINTENTOS = 3;

const $ = id => document.getElementById(id);
const picker = $('picker'), lista = $('lista'), resumen = $('resumen');
let hechos = 0, fallidos = 0, total = 0, corriendo = false, cola = [], wake = null;

$('elegir').onclick = () => picker.click();
$('mas').onclick = () => { $('mas').classList.add('hide'); picker.click(); };
picker.onchange = () => {
  const arch = Array.from(picker.files || []);
  picker.value = '';
  if (!arch.length) return;
  arch.forEach(f => { cola.push(crearFila(f)); total++; });
  actualizarResumen();
  if (!corriendo) procesar();
};

function mimeDe(f){
  if (f.type) return f.type;
  const e = (f.name.split('.').pop() || '').toLowerCase();
  const m = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',heif:'image/heif',webp:'image/webp',gif:'image/gif',
             mp4:'video/mp4',mov:'video/quicktime',m4v:'video/x-m4v','3gp':'video/3gpp',webm:'video/webm'};
  return m[e] || '';
}
function tam(b){ return b > 1048576 ? (b/1048576).toFixed(b > 1e8 ? 0 : 1) + ' MB' : Math.max(1, Math.round(b/1024)) + ' KB'; }

function crearFila(file){
  const el = document.createElement('div'); el.className = 'f';
  el.innerHTML = '<div class="n"><span></span><span></span></div><div class="bar"><i></i></div><small>En espera…</small>';
  el.querySelector('.n span').textContent = file.name;
  el.querySelectorAll('.n span')[1].textContent = tam(file.size);
  lista.appendChild(el);
  return { file, el, bar: el.querySelector('i'), msg: el.querySelector('small') };
}
function estado(it, txt, cls){ it.msg.textContent = txt; if (cls) it.el.classList.add(cls); }
function actualizarResumen(){
  const falta = total - hechos - fallidos;
  resumen.textContent = falta > 0 ? `Subiendo… ${hechos} de ${total} listos` :
    (fallidos ? `${hechos} listos · ${fallidos} con error (toca "Subir más" para reintentar)` : `¡Gracias! ${hechos} archivo${hechos===1?'':'s'} subido${hechos===1?'':'s'} 🎉`);
}

async function procesar(){
  corriendo = true;
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch(e){}
  while (cola.length){
    const it = cola.shift();
    let ok = false, ultimo = '';
    for (let i = 1; i <= REINTENTOS && !ok; i++){
      try { estado(it, i > 1 ? `Reintentando (${i}/${REINTENTOS})…` : 'Preparando…'); await subir(it); ok = true; }
      catch(e){ ultimo = e.message || 'Error'; if (e.fatal) break; await new Promise(r => setTimeout(r, 1500 * i)); }
    }
    if (ok){ hechos++; it.bar.style.width = '100%'; estado(it, '¡Listo! ✓', 'ok'); }
    else { fallidos++; estado(it, 'No se pudo subir: ' + ultimo, 'err'); }
    actualizarResumen();
  }
  corriendo = false;
  if (wake){ try{ wake.release(); }catch(e){} wake = null; }
  $('mas').classList.remove('hide');
}

async function subir(it){
  const f = it.file, mime = mimeDe(f);
  if (!mime.startsWith('image/') && !mime.startsWith('video/')) throw Object.assign(new Error('Solo fotos y videos'), {fatal:true});
  if (f.size > MAX_BYTES) throw Object.assign(new Error('Archivo demasiado grande'), {fatal:true});

  // 1) pedir enlace de subida al script (text/plain evita preflight de CORS)
  const r = await fetch(SCRIPT_URL, {
    method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'init', name:f.name, mimeType:mime, size:f.size, quien:$('quien').value})
  });
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.error || 'Error'), {fatal:true});

  // 2) subir directo a Google Drive con progreso
  await new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', j.url);
    x.setRequestHeader('Content-Type', mime);
    x.upload.onprogress = e => { if (e.lengthComputable){ const p = Math.round(e.loaded / e.total * 100); it.bar.style.width = p + '%'; it.msg.textContent = 'Subiendo… ' + p + '%'; } };
    x.onload = () => (x.status === 200 || x.status === 201) ? res() : rej(new Error('Drive respondió ' + x.status));
    x.onerror = () => rej(new Error('Se cortó la conexión'));
    x.ontimeout = () => rej(new Error('Tardó demasiado'));
    x.send(f);
  });
}
</script>
</body>
</html>
